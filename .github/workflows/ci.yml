name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  compile:
    name: Byte-compile sandbox stubs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Lightweight smoke test: every *.py must parse/compile.
      # This catches syntax errors without installing the heavy ML stack.
      - name: Compile all Python files
        run: python -m compileall -q .
